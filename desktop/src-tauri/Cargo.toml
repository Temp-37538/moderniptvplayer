[package]
name = "moderniptv-desktop"
version = "0.0.1"
edition = "2021"
description = "Windows shell: libmpv plays the IPTV video inside a Tauri window"
publish = false
default-run = "ModernIPTV"

[[bin]]
name = "ModernIPTV"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
url = "2"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mpv-engine = { path = "../mpv-engine" }
