[package]
name = "moderniptvplayer-desktop"
version = "0.1.0"
description = "Modern IPTV Player desktop application"
authors = ["Modern IPTV Player"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
moderniptvplayer-native-player = { path = "../native-player" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
