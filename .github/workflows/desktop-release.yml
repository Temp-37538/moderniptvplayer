name: Desktop release

# Publishes the Windows NSIS installer when a v* tag is pushed.
# The tag must be v plus the [package] version in desktop/src-tauri/Cargo.toml
# (v0.0.1 for version 0.0.1). Tauri v2 reads that version because
# tauri.conf.json does not set one. A mismatch fails before the build.
# The tagged commit must already be on main (an ancestor of origin/main).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Publish the Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
      # Static C runtime: the .exe needs no Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestor check needs the history of main, not only the tag commit.
          fetch-depth: 0

      - name: Check the tag commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=tag not on main::Commit ${GITHUB_SHA} (${GITHUB_REF_NAME}) is not an ancestor of origin/main. Tag a commit that is already on main."
            exit 1
          fi

      - name: Check the tag matches Cargo.toml
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error title=version::Could not read the [package] version from src-tauri/Cargo.toml."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v${version}" ]; then
            echo "::error title=version mismatch::Tag ${tag} does not match Cargo.toml version ${version} (expected v${version}). Refusing to publish an installer whose version differs from the tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: ./.github/actions/fetch-libmpv

      - name: Install npm packages and generate the icons
        run: |
          npm install
          npm run setup

      - name: Build the installer
        run: |
          set -o pipefail
          if ! npx tauri build --bundles nsis 2>&1 | tee build.log; then
            echo "::error title=tauri build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          if [ ${#installers[@]} -ne 1 ]; then
            echo "::error title=nsis::Expected one NSIS installer under target/release/bundle/nsis, found ${#installers[@]}"
            find target -name '*.exe' -print || true
            exit 1
          fi
          installer="${installers[0]}"
          name=$(basename "$installer")
          # Hash from stdin: the installer path may contain Windows backslashes.
          hash=$(sha256sum < "$installer" | cut -d' ' -f1)
          checksum="${RUNNER_TEMP}/${name}.sha256"
          printf '%s  %s\n' "$hash" "$name" > "$checksum"
          version=$(sed -n '/^\[package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error title=version::Could not read the [package] version from src-tauri/Cargo.toml."
            exit 1
          fi
          notes=$(cat <<EOF
Windows per-user NSIS installer for ModernIPTV ${version}. No administrator rights required. libmpv-2.dll is included.

${name}
SHA256: ${hash}
EOF
)
          gh release create "$GITHUB_REF_NAME" "$installer" "$checksum" \
            --title "ModernIPTV v${version}" \
            --notes "$notes"
