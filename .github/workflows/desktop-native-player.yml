name: Desktop native player

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-native-player.yml"
  push:
    branches:
      - "feat/desktop-native-player"
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-native-player.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/native-player
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install libmpv build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
