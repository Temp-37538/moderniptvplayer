name: Desktop native player

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-native-player.yml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install standalone frontend dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile
      - name: Type-check and build React frontend
        run: pnpm build

  rust:
    name: Rust and Tauri checks (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/native-player
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config libmpv-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run native player unit tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend for Tauri context generation
        run: |
          pnpm --dir ../ install --ignore-workspace --no-frozen-lockfile
          pnpm --dir ../ build
      - name: Check Tauri application shell
        run: cargo check --manifest-path ../src-tauri/Cargo.toml

  windows:
    name: Windows Tauri build and installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/native-player
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Initialize MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend for Tauri context generation
        run: |
          pnpm --dir ../ install --ignore-workspace --no-frozen-lockfile
          pnpm --dir ../ build
      - name: Download and prepare libmpv
        shell: pwsh
        working-directory: apps/desktop
        run: ./scripts/setup-mpv-windows.ps1
      - name: Check Windows Tauri application
        run: cargo check --manifest-path ../src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build Windows MSI installer
        shell: pwsh
        working-directory: apps/desktop
        run: pnpm tauri build --bundles msi
      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: moderniptvplayer-windows-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
