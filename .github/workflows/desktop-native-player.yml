name: Desktop native player

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-native-player.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/native-player
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install libmpv build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  windows:
    name: Windows target compile check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/native-player
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # cargo check validates Rust code for the Windows ABI without requiring
      # the native mpv import library at link time. The packaged app still
      # needs the matching libmpv DLL/import library at release-build time.
      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc
