name: Desktop

# Builds the Windows NSIS installer and tests the libmpv engine layer.
# Download the installer artifact of a run; nothing else has to be installed locally.
on:
  push:
    branches: ["desktop/**"]
    paths: ["desktop/**", ".github/workflows/desktop.yml", ".github/actions/fetch-libmpv/**"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml", ".github/actions/fetch-libmpv/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-linux:
    name: Engine tests (Linux, real libmpv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install libmpv and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 ffmpeg
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Make the test media
        run: bash scripts/make-fixtures.sh fixtures
      - name: Engine tests
        working-directory: desktop/mpv-engine
        env:
          MPV_FIXTURES: ../fixtures
        run: cargo test -- --test-threads=1
      # The Windows job plays the same files with libmpv for Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: desktop/fixtures
          retention-days: 1

  windows:
    name: Windows (build the installer, test the engine on libmpv for Windows)
    needs: engine-linux
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
      # Static C runtime: the .exe needs no Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - uses: ./.github/actions/fetch-libmpv

      - name: Install npm packages and generate the icons
        run: |
          npm install
          npm run setup

      - name: Build the installer
        run: |
          set -o pipefail
          if ! npx tauri build --bundles nsis 2>&1 | tee build.log; then
            echo "::error title=tauri build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Check the installer exists
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          if [ ${#installers[@]} -ne 1 ]; then
            echo "::error title=nsis::Expected one NSIS installer under target/release/bundle/nsis, found ${#installers[@]}"
            find target -name '*.exe' -print || true
            exit 1
          fi
          ls -la "${installers[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: moderniptv-windows
          path: desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      # Last on purpose: the app is already uploaded whatever this says.
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: desktop/fixtures
      - name: Engine tests on libmpv for Windows
        working-directory: desktop/mpv-engine
        env:
          MPV_LIB: ${{ github.workspace }}\desktop\src-tauri\lib\libmpv-2.dll
          MPV_FIXTURES: ../fixtures
        run: |
          set -o pipefail
          if ! cargo test -- --test-threads=1 2>&1 | tee test.log; then
            echo "::error title=engine tests failed on Windows::$(grep -E '^test |panicked|assertion|left:|right:|FAILED|failed' test.log | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
