name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Dummy values, only used so env validation and the Prisma config load in CI.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3001
  CORS_ORIGIN: http://localhost:3001
  SECRET_KEY: ci-only-secret-key-0000

jobs:
  checks:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @moderniptvplayer/db exec prisma validate
      # Run Prisma directly (like the Vercel build): going through turbo would
      # strip DATABASE_URL from the task environment (turbo strict env mode).
      - name: Generate Prisma client
        run: pnpm --filter @moderniptvplayer/db db:generate
      - name: Biome
        run: pnpm check
      - name: Type check
        run: pnpm check-types
      - name: Tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @moderniptvplayer/db db:generate
      - name: Next build
        working-directory: apps/web
        run: pnpm exec next build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: transitive advisories should not block unrelated changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

  catalog-integration:
    name: Catalog index integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: catalog_index_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d catalog_index_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Integration tests are gated exclusively by this dedicated variable.
      # The ordinary DATABASE_URL remains the harmless workflow-level dummy.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/catalog_index_test
      TEST_SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/catalog_index_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create shadow database for migration diff
        env:
          PGPASSWORD: ci
        run: createdb --host localhost --username ci catalog_index_shadow
      - name: Validate Prisma schema
        run: pnpm --filter @moderniptvplayer/db exec prisma validate
      - name: Generate Prisma client
        run: pnpm --filter @moderniptvplayer/db db:generate
      - name: Deploy migrations to the isolated test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm --filter @moderniptvplayer/db db:deploy
      - name: Verify SQL migrations match the Prisma schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_SHADOW_DATABASE_URL: ${{ env.TEST_SHADOW_DATABASE_URL }}
        run: >
          pnpm --filter @moderniptvplayer/db exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema
          --shadow-database-url "$TEST_SHADOW_DATABASE_URL"
          --exit-code
      - name: Run catalog integration assertions
        run: |
          set -euo pipefail
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL is not set; skipping catalog integration assertions."
            exit 0
          fi
          psql "${TEST_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file packages/db/prisma/tests/catalog-index.integration.sql
